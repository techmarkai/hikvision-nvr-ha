name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest change under us; a weekly run catches it before a user does.
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  lint:
    name: Lint and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check custom_components tests
      - run: python -m compileall -q custom_components tests
      # These assert on the shape of the integration itself -- service
      # registration, translations, icons -- and need no Home Assistant install.
      - run: python tests/test_services.py
      - run: python tests/test_translations.py
      - run: node --check custom_components/hikvision_nvr/frontend/hikvision-nvr-card.js
      - run: node --check custom_components/hikvision_nvr/frontend/hikvision-nvr-panel.js
